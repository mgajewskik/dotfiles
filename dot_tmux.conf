# tmux config: only what differs from tmux 3.7 defaults.
#
# Cheat sheet (prefix is C-b or C-a)
#   windows   c new  , rename  & kill  w choose  0-9 go to  n/p next/prev  M-n/M-p next/prev with activity
#   panes     " split down  % split right  x kill  z zoom  ! move to new window  o next  ; last  { } swap
#   layouts   Space next layout  E spread evenly  M-1..M-5 presets  C-arrows resize by 1  M-arrows resize by 5
#   sessions  s choose  $ rename  d detach  ( ) prev/next  q session wizard (plugin)
#   copy      [ copy mode (v select, y copy, / search, q quit)  ] paste  = choose buffer
#   other     : command prompt  ? list keys  ~ messages  t clock  f find window  i window info
#   custom    h/j/k/l select pane  H/J/K/L resize by 15  r reload config  / man page in split
#             T swap with window 1  C-Left/C-Right (no prefix) move window left/right
#   replaced  l last window  L last session  r redraw  / describe key  q pane numbers

set -g prefix2 C-a
set -g mouse on
set -g history-limit 15000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 4000
set -g focus-events on
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity on
set -g set-titles on
set -g set-titles-string '#S: #W' # shown as the window title in waybar
# window name: the folder at the shell prompt, otherwise the running program (nvim, claude, k9s)
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'
set -as terminal-features ',*:RGB' # truecolor in alacritty and ghostty

# copy mode with vi keys; set-clipboard sends copies to the system clipboard through the terminal
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# yazi image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

bind r source-file ~/.tmux.conf
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 15
bind J resize-pane -D 15
bind K resize-pane -U 15
bind L resize-pane -R 15
bind T swap-window -s 1
bind / command-prompt -p "man page:" "split-window -h 'exec man %1'"
bind -n C-Left swap-window -t -1\; select-window -t -1
bind -n C-Right swap-window -t +1\; select-window -t +1
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down

# theme: TokyoNight
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g status-style "fg=#7aa2f7,bg=#1f2335"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left "#[fg=#15161E,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1f2335,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#1f2335]  #[fg=#3b4261,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %I:%M %p #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#7aa2f7,bold] #h "
setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-format "#[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1f2335,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#1f2335,nobold,nounderscore,noitalics]"

# plugins, managed by tpm (installs itself on first start); continuum must load after status-right
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @session-wizard 'q'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
run -b '~/.tmux/plugins/tpm/tpm'

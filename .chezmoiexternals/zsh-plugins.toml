# zsh plugins, sourced from ~/.zshrc; chezmoi refreshes them weekly
[".zsh/fzf-tab"]
type = "archive"
url = "https://github.com/Aloxaf/fzf-tab/archive/refs/heads/master.tar.gz"
stripComponents = 1
refreshPeriod = "168h"

[".zsh/zsh-syntax-highlighting"]
type = "archive"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/heads/master.tar.gz"
stripComponents = 1
refreshPeriod = "168h"

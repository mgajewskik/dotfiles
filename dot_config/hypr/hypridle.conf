# Optional Sway-specific hypridle config. It is not enabled by default.

general {
    lock_cmd = pidof swaylock || swaylock
    before_sleep_cmd = pidof swaylock || swaylock
    after_sleep_cmd = swaymsg "output * power on"
}

listener {
    timeout = 300
    on-timeout = pidof swaylock || swaylock
}

listener {
    timeout = 360
    on-timeout = swaymsg "output * power off"
    on-resume = swaymsg "output * power on"
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

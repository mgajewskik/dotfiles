# Only non-default values; see `man 5 alacritty` for the rest.

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 100, lines = 50 }
padding = { x = 4, y = 4 }

[font]
size = 11.5
normal = { family = "JetBrainsMono" } # bold/italic inherit this family
offset = { x = 0, y = 0 }

[cursor]
style = "Beam"
thickness = 0.17

[scrolling]
history = 100000
multiplier = 15

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[keyboard]
bindings = [
  { key = "Return", mods = "Shift", chars = "\u001B\r" },
]

# Kanagawa
[colors]
draw_bold_text_with_bright_colors = true
primary = { background = "#1f1f28", foreground = "#dcd7ba" }
selection = { background = "#2d4f67", foreground = "#c8c093" }
indexed_colors = [
  { index = 16, color = "#ffa066" },
  { index = 17, color = "#ff5d62" },
]

[colors.normal]
black   = "#090618"
red     = "#c34043"
green   = "#76946a"
yellow  = "#c0a36e"
blue    = "#7e9cd8"
magenta = "#957fb8"
cyan    = "#6a9589"
white   = "#c8c093"

[colors.bright]
black   = "#727169"
red     = "#e82424"
green   = "#98bb6c"
yellow  = "#e6c384"
blue    = "#7fb4ca"
magenta = "#938aa9"
cyan    = "#7aa89f"
white   = "#dcd7ba"

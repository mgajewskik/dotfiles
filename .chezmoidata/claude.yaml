claude:
  permissions:
    deny:
      # privilege escalation
      - 'sudo *'
      - 'doas *'
      - 'pkexec *'
      - 'su'
      - 'su *'
      - 'runuser *'
      # deletes outside the project (`rm -rf` there is stopped by the sandbox write boundary)
      - 'rm *--no-preserve-root*'
      - 'find / *-delete*'
      - 'find ~ *-delete*'
      # disks and filesystems
      - 'mkfs*'
      - 'dd * of=/dev/*'
      - 'wipefs*'
      - 'shred*'
      - 'fdisk*'
      - 'sfdisk*'
      - 'parted*'
      - 'sgdisk*'
      - 'cryptsetup*'
      - 'mkswap*'
      # host power, services, processes
      - 'shutdown*'
      - 'reboot*'
      - 'halt*'
      - 'poweroff*'
      - 'init 0*'
      - 'init 6*'
      - 'systemctl *reboot*'
      - 'systemctl *poweroff*'
      - 'systemctl *halt*'
      - 'systemctl *stop *'
      - 'systemctl *disable *'
      - 'systemctl *mask *'
      - 'systemctl --user enable*'
      - 'loginctl *terminate*'
      - 'loginctl *kill*'
      - 'kill -9 -1'
      - 'kill -KILL -1'
      - 'kill -- -1'
      # persistence, permissions, kernel, firewall
      - 'crontab*'
      - 'chmod -R 777*'
      - 'chmod 777 -R*'
      - 'chown -R*'
      - 'chattr*'
      - 'modprobe -r*'
      - 'iptables -F*'
      - 'iptables --flush*'
      - 'nft flush*'
      - 'ufw disable*'
      # remote code execution, reverse shells
      - 'curl * | sh*'
      - 'curl * | bash*'
      - 'wget * | sh*'
      - 'wget * | bash*'
      - 'sh'
      - 'bash'
      - 'zsh'
      - 'sh -'
      - 'bash -'
      - 'sh -s*'
      - 'bash -s*'
      - 'bash -i >& /dev/tcp*'
      - 'nc -e*'
      - 'ncat -e*'
      - 'ssh -R*'
      # git: history rewrite, losing uncommitted work
      - 'git reset --hard*'
      - 'git reset *--hard*'
      - 'git clean -*f*'
      - 'git clean *--force*'
      - 'git checkout .'
      - 'git checkout -- .'
      - 'git restore .'
      - 'git stash clear*'
      - 'git reflog expire*'
      - 'git filter-branch*'
      - 'git filter-repo*'
      # containers (prune, privileged / host-root mounts)
      - 'docker system prune*'
      - 'docker volume prune*'
      - 'docker volume rm*'
      - 'podman system prune*'
      - 'podman volume rm*'
      - '* run *--privileged*'
      - '* run *-v /:/*'
      - '* run *--volume /:/*'
      - '* run *--pid=host*'
    remote:
      # git: rewriting or deleting remote history and branches
      - 'git push --force*'
      - 'git push -f*'
      - 'git push *--force*'
      - 'git push * -f*'
      - 'git push *--mirror*'
      - 'git push *--delete*'
      - 'git push * -d *'
      - 'git push * +*'
      # terraform / opentofu
      - 'terraform *destroy*'
      - 'terraform *apply*-auto-approve*'
      - 'terraform *state rm*'
      - 'terraform *state mv*'
      - 'terraform *state push*'
      - 'terraform *force-unlock*'
      - 'terraform *workspace delete*'
      - 'tofu *destroy*'
      - 'tofu *apply*-auto-approve*'
      - 'tofu *state rm*'
      - 'tofu *state mv*'
      - 'tofu *state push*'
      - 'tofu *force-unlock*'
      - 'tofu *workspace delete*'
      # kubernetes / helm
      - 'kubectl *delete *'
      - 'kubectl *drain*'
      - 'kubectl *scale*--replicas=0*'
      - 'kubectl *replace*--force*'
      - 'kubectl *apply*--prune*'
      - 'helm *uninstall*'
      - 'helm *delete*'
      # cloud
      - 'aws * delete-*'
      - 'aws * terminate-instances*'
      - 'aws s3 rm*'
      - 'aws s3 rb*'
      - 'aws s3 *--delete*'
      - 'gcloud * delete*'
      - 'az * delete*'
      - 'doctl * delete*'
      # publishing and exposure
      - 'gh repo delete*'
      - 'gh repo archive*'
      - 'gh api *DELETE*'
      - 'gh repo create *--public*'
      - 'gh repo edit *--visibility*'
      - 'gh secret *'
      - 'gh release create*'
      - 'gh release delete*'
      - 'npm publish*'
      - 'cargo publish*'
      - 'twine upload*'
      - 'gem push*'
      # databases (matched anywhere in the command)
      - '*DROP DATABASE*'
      - '*drop database*'
      - '*DROP TABLE*'
      - '*drop table*'
      - '*DROP SCHEMA*'
      - '*drop schema*'
      - '*TRUNCATE *'
      - '*truncate table*'
      - '*FLUSHALL*'
      - '*flushall*'
      - '*FLUSHDB*'
      - '*flushdb*'
      - '*dropDatabase*'
    ask:
      # leaves the machine
      - 'gh pr merge*'
      # installs
      - 'pacman -S*'
      - 'yay -S*'
      - 'paru -S*'
      - 'npm install -g*'
      - 'npm i -g*'
      - 'pip install*'
      - 'pip3 install*'
      - 'uv tool install*'
      - 'cargo install*'
      - 'go install*'
      - 'mise install*'
      - 'mise use -g*'

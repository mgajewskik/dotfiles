# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
# gh = "github:{path}"

# all_follow maps input names at every depth to the top-level pin they follow
# opt out per-input with exclude_follow, scope with flake: or tack:
[all_follow]
# nixpkgs = "nixpkgs"
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# recursively omit selected upstream inputs from every top-level pin
[omit_inputs]
# names = ["flake-compat", "tack:cachix"]

# signers name the public keys pins can require, as an ssh key line, an
# armored pgp key, a file under .tack holding either, or an array of those.
# `tack signer add <name> --github <user>` fills one in from GitHub
[signers]
# alice = "ssh-ed25519 AAAA..."

# default fetch_mode for fetch pins ("eval" or "build")
# [tack]
# fetch_mode = "build"
# type = "fetch"

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed, overrides [tack] type
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } immediate-input override map, or a
#                   "pin/input" string in place of every other field to make
#                   this pin that input
#   exclude_follow  all_follow names to skip, flake:/tack: scoped or *
#   omit_inputs     upstream input names to omit recursively for this pin
#   keep_inputs     omitted input names to allow recursively for this pin
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
#   fetch_mode      fetch-only "eval" (default) or "build" to defer fetching to build time
#   signers         names from [signers], one of whom must have signed the locked commit
#   patches         patch urls or files relative to this dir, applied in order
#   tag             follow the newest tag like "v{version}", where {version} is numbers
#                   joined by `.` `-` or `_`, so non-numeric tags like "v2.1-rc1" are
#                   skipped, needs a github, gitlab or network git url with
#                   no ref or rev, not file://, or for a fixed pin a release
#                   download url naming the asset with {tag} or {version}. a trailing
#                   * matches anything after, like a build hash in "b{version}-*". a
#                   named placeholder like {commit} matches letters and digits and can
#                   also be used in the url
#   tags_from       fixed-only repo url or http(s) page to read tag's tags from, for an
#                   asset that isn't a release download
[inputs]

[inputs.disko]
url = "github:nix-community/disko"
tag = "v{version}"

[inputs.disko.follows]
nixpkgs = "nixpkgs"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.flake-parts.follows]
nixpkgs-lib = "nixpkgs"

[inputs.import-tree]
url = "github:vic/import-tree"
tag = "v{version}"

[inputs.nixos-hardware]
url = "github:NixOS/nixos-hardware"

[inputs.nixos-hardware.follows]
nixpkgs = "nixpkgs"

[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-26.05"

[inputs.nixpkgs-unstable]
url = "github:NixOS/nixpkgs/nixos-unstable"

[inputs.vortix]
url = "github:Harry-kp/vortix"
tag = "v{version}"

[inputs.vortix.follows]
nixpkgs = "nixpkgs"

[inputs.voxtype]
url = "github:peteonrails/voxtype"
tag = "v{version}"

[inputs.voxtype.follows]
nixpkgs = "nixpkgs"

[inputs.tack]
url = "github:manic-systems/tack"
tag = "v{version}"

[inputs.tack.follows]
nixpkgs = "nixpkgs-unstable"

[inputs.helium]
url = "https://github.com/imputnet/helium-linux/releases/download/{version}/helium-{version}-x86_64_linux.tar.xz"
type = "fixed"
unpack = "tarball"
tag = "helium-{version}-x86_64_linux.tar.xz"
tags_from = "https://api.github.com/repos/imputnet/helium-linux/releases/latest"

[inputs.claude-desktop]
url = "https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/{tag}"
type = "fixed"
unpack = "file"
tag = "claude-desktop_{version}_amd64.deb"
tags_from = "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages"

[inputs.grok-bot]
url = "https://downloads.cursor.com/grokbot/stable/{commit}/linux/x64/grok-bot_{version}_amd64.deb"
type = "fixed"
unpack = "file"
tag = "stable/{commit}/linux/x64/grok-bot_{version}_amd64.deb"
tags_from = "https://api2.cursor.sh/updates/api/download/stable/linux-x64/sand"
